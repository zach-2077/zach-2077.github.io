<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zach</title>
<meta name="description" content="Software Engineer at Airwallex - Building ML Platform">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: Charter, Georgia, 'Times New Roman', serif;
    background: #FAF6F1;
    color: #2C2C2C;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 2rem;
    line-height: 1.6;
  }

  main {
    max-width: 680px;
    width: 100%;
    border-left: 3px solid #1B3A5C;
    padding-left: 2rem;
  }

  h1 {
    font-size: 2.4rem;
    font-weight: 600;
    color: #1B3A5C;
    letter-spacing: -0.02em;
    margin-bottom: 0.15rem;
  }

  .role {
    font-size: 1.05rem;
    color: #5A5A5A;
    margin-bottom: 1.5rem;
  }

  .role strong {
    color: #2C2C2C;
    font-weight: 600;
  }

  .links {
    display: flex;
    gap: 1.2rem;
    flex-wrap: wrap;
    margin-bottom: 2.5rem;
  }

  .links a {
    color: #1B3A5C;
    text-decoration: none;
    display: inline-flex;
    transition: color 0.2s;
  }

  .links a:hover {
    color: #2E5A8A;
  }

  .links a svg {
    width: 22px;
    height: 22px;
    fill: currentColor;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    margin-bottom: 1.5rem;
    color: #1B3A5C;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #D4C9BC;
  }

  .project {
    margin-bottom: 1rem;
  }

  .project a {
    color: #1B3A5C;
    text-decoration: none;
    font-size: 1.05rem;
    font-weight: 600;
    border-bottom: 1px solid transparent;
    transition: border-color 0.2s;
  }

  .project a:hover {
    border-bottom-color: #1B3A5C;
  }

  .project-desc {
    color: #5A5A5A;
    font-size: 0.95rem;
  }

  @media (max-width: 480px) {
    body { padding: 1.5rem 1rem; align-items: flex-start; padding-top: 3rem; }
    main { padding-left: 1.2rem; }
    h1 { font-size: 1.8rem; }
  }
</style>
</head>
